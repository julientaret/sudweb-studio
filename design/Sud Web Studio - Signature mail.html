<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><title>Signature mail — Sud Web Studio</title>
<style>
a{color:#121b27}a:hover{color:#c07a3e}
body{margin:0;background:#ecebe7;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;color:#121b27;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 20px;box-sizing:border-box}
.wrap{display:flex;flex-direction:column;gap:18px;width:100%;max-width:640px}
.mail{background:#fff;border-radius:12px;padding:32px 36px;box-shadow:0 1px 2px rgba(0,0,0,.06),0 8px 30px rgba(18,27,39,.08)}
.mail p{margin:0 0 22px;font-size:14px;line-height:1.6;color:#3a4654}
.bar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.bar span{font-family:ui-monospace,Menlo,monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#6b7684}
button{font:inherit;font-size:13px;padding:10px 18px;border-radius:999px;border:0;background:#121b27;color:#ece7de;cursor:pointer}
button:hover{background:#c07a3e}
</style></head>
<body>
<div class="wrap">
<div class="bar"><span>Aperçu dans un mail</span><button id="copy">Copier la signature</button></div>
<div class="mail">
<p>Bonjour,<br>…<br>Bien cordialement,</p>
<div id="sig">
<table cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;font-family:Helvetica,Arial,sans-serif;color:#121b27">
<tr>
<td valign="top" style="padding:2px 18px 0 0;border-right:2px solid #e9a578"><img src="https://sudweb-studio.com/assets/signature-logo.png" width="52" height="52" alt="Sud Web Studio" style="display:block;width:52px;height:52px;border:0"></td>
<td valign="top" style="padding:0 0 0 18px">
<div style="font-family:Georgia,'Times New Roman',serif;font-size:18px;font-weight:bold;line-height:1.2;color:#121b27">Julien Taret-Falconetti</div>
<div style="font-size:13px;line-height:1.5;color:#c07a3e;font-style:italic;font-family:Georgia,'Times New Roman',serif;padding-top:1px">Fondateur, Sud Web Studio</div>
<div style="font-size:12.5px;line-height:1.7;color:#3a4654;padding-top:8px">
<a href="mailto:julien@sudweb-studio.com" style="color:#121b27;text-decoration:none">julien@sudweb-studio.com</a> &nbsp;·&nbsp; <a href="tel:+33671692460" style="color:#121b27;text-decoration:none">06 71 69 24 60</a><br>
<a href="https://sudweb-studio.com" style="color:#121b27;text-decoration:none;font-weight:bold">sudweb-studio.com</a> &nbsp;·&nbsp; Villeneuve-sur-Lot
</div>
</td>
</tr>
</table>
</div>
</div>
</div>
<script>
document.getElementById('copy').onclick=async()=>{
const sig=document.getElementById('sig').cloneNode(true);
const html='<body dir="auto" style="caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0); letter-spacing: normal; orphans: 2; text-align: start; text-indent: 0px; text-transform: none; white-space: normal; widows: 2; word-spacing: 0px; -webkit-text-stroke-width: 0px; text-decoration: none; overflow-wrap: break-word; -webkit-nbsp-mode: space; line-break: after-white-space;">'+sig.innerHTML.replace(/\n\s*/g,'').trim()+'</body><br class="Apple-interchange-newline">',b=document.getElementById('copy');
try{await navigator.clipboard.writeText(html);b.textContent='HTML copié ✓'}
catch(e){const t=document.createElement('textarea');t.value=html;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();b.textContent='HTML copié ✓'}
setTimeout(()=>b.textContent='Copier la signature',1800)};
</script>
</body></html>
