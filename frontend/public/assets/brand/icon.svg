<?xml version="1.0" encoding="UTF-8"?>
<!--
  Icone de marque Sud Web Studio : source unique des favicons.
  Rasterisee en PNG et ICO par frontend/scripts/build-brand.mjs.

  Le monogramme complet du site (symbole sws-mark, frontend/includes/brand.php) :
  les trois lettres S-W-S, d'une seule couleur. Les diagonales centrales SONT le
  W ; les retirer donnerait un trace plus propre en petit, mais la marque se
  lirait SS.

  Seul ecart avec le site : le trace est pose sur un carre arrondi sombre au lieu
  d'epouser la couleur du texte, pour s'afficher aussi bien sur un onglet clair
  que sombre.

  A 16 px (favicon.ico sur ecran non retina) les diagonales se melangent en un
  aplat : c'est la limite du dessin, assumee. Des 32 px, soit un onglet retina ou
  un favori, les trois lettres se detachent. D'ou le peu de marge autour du
  trace : plus le monogramme occupe le carre, plus ses diagonales tiennent en
  petit.

  Couleurs reprises des tokens (frontend/src/css/tokens.css) : fond et peche.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="112" fill="#121b27"/>
  <g transform="translate(38.8 37.9) scale(0.8724)" fill="#e9a578">
